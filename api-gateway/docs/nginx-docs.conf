# Shared by bootstrap and discovery-generated configurations.
location = /swagger { return 308 /swagger/; }
location = /swagger/ { rewrite ^ /swagger/index.html last; }
location = /swagger/index.html {
    alias /opt/gateway/docs/index.html;
    default_type text/html;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET { deny all; }
}
location = /swagger/swagger-config.js {
    alias /opt/gateway/docs/swagger-config.js;
    default_type application/javascript;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET { deny all; }
}
location ^~ /swagger/vendor/ {
    alias /opt/gateway/docs/vendor/;
    types { text/css css; application/javascript js; application/json json; }
    default_type text/plain;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET { deny all; }
}
location = /openapi.json {
    alias /opt/gateway/docs/openapi.json;
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET { deny all; }
}
