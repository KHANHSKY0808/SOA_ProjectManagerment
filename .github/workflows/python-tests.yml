name: Python service tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - academic-services
          - regist-service
          - log-services
          - topic-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

  test-gateway:
    name: Test Consul gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation validation tooling
        run: python -m pip install -r api-gateway/tests/requirements-docs.txt
      - name: Discovery and OpenAPI unit tests
        run: python -m unittest discover -s api-gateway/tests -p 'test_*.py'
      - name: Build gateway and check Compose
        working-directory: api-gateway
        run: |
          docker compose config --quiet
          docker compose build
      - name: Isolated Nginx discovery integration tests
        run: >-
          docker run --rm
          --mount type=bind,source=${{ github.workspace }}/api-gateway/tests,target=/tests,readonly
          --entrypoint python3 soa-api-gateway:local /tests/integration.py
